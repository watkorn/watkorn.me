# Build main, run the smoke tests, then publish only build/ to the gh-pages branch.
# If any test fails, nothing is published and the live site stays as it was.
# GitHub Pages: Settings → Pages → Source = "Deploy from a branch" → gh-pages / (root)
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-gh-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write # push to the gh-pages branch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # Chromium draws the link-preview images during the build (scripts/og.mjs) and runs the tests
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build static site (prerendered pages, OG images, sitemap, RSS, CSP)
        run: npm run build

      - name: Smoke tests
        run: npx playwright test

      - name: Publish build/ to gh-pages branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # gh-pages' -u parser rejects the "[bot]" address, so set the identity via git config
          # --dotfiles: publish build/.well-known/ (security.txt) too
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          npx gh-pages -d build --nojekyll --dotfiles \
            -m "Deploy ${GITHUB_SHA::7}" \
            -r "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
